# Revisión automática en cada push y PR: lint + pruebas (no usa Drive ni claves).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar rclone (prueba de ida y vuelta con Drive simulado)
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone
      - run: uv sync
      - run: make check
