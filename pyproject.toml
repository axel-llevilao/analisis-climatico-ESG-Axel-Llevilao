[project]
name = "climachile"
version = "0.1.0"
description = "Plataforma abierta de datos para análisis de riesgo climático en Chile"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Axel Llevilao" }]
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "pyyaml>=6",
]

[project.scripts]
climachile = "climachile.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climachile"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
